<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pan-American Highway | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/estilo.css" />
    <link rel="icon" href="./assets/icon/favicon2.ico" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
  </head>

  <body>
    <header class="header">
      <div class="container">
        <a href="index.html" class="logo"> 
          <img src="assets/imgs/logo.png" alt="Pan American Highway"> 
        </a>

        <nav>
          <ul class="navbar">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="timeline.html">Timeline</a></li>
            <li><a href="perfil.html">Perfil</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="login">
      <video
        class="videoCadastro"
        src=".\assets\Videos\timesSquare.mp4"
        autoplay
        muted
        loop
      ></video>
      <div class="alerta_erro">
        <div class="card_erro" id="cardErro">
          <span id="mensagem_erro"></span>
        </div>
      </div>
      <div class="container">
        <div class="card card-login">
          <h2>Entre na sua conta</h2>
          <div class="formulario">
            <div class="campo">
              <label for="ipt_email">✉️</label>
              <input id="ipt_email" type="email" placeholder="Login" />
              <div id="erroEmail" class="msg-erro"></div>
            </div>
            <div class="campo">
              <label for="ipt_senha">🔒</label>
              <input id="ipt_senha" type="password" placeholder="******" />
              <div id="erroSenha" class="msg-erro"></div>
            </div>
            <button class="botao-cadastro" onclick="entrar()">Entrar</button>
          </div>

          <div id="div_aguardar" class="loading-div">
            <img src="./assets/circle-loading.gif" id="loading-gif" />
          </div>

          <div id="div_erros_login"></div>
        </div>
      </div>
    </div>
  </body>
</html>

<script>
  function entrar() {
    var emailVar = ipt_email.value.trim();
    var senhaVar = ipt_senha.value;
    var flagError = false;

    if (emailVar == "") {
      erroEmail.innerHTML = `Informe seu email`;
      flagError = true;
    } else if (emailVar.includes("@") && emailVar.includes(".")) {
      erroEmail.innerHTML = ``;
    } else {
      erroEmail.innerHTML = `Email inválido`;
      flagError = true;
    }

    if (senhaVar == "") {
      erroSenha.innerHTML = `Informe sua senha`;
      flagError = true;
    } else {
      erroSenha.innerHTML = ``;
    }

    if (flagError) {
      return false;
    }

    aguardar();

    console.log("FORM LOGIN: ", emailVar);
    console.log("FORM SENHA: ", senhaVar);

    fetch("/usuarios/autenticar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        emailServer: emailVar,
        senhaServer: senhaVar,
      }),
    })
      .then(function (resposta) {
        console.log("ESTOU NO THEN DO entrar()!");

        if (resposta.ok) {
          console.log(resposta);

          resposta.json().then((json) => {
            console.log(json);
            console.log(JSON.stringify(json));
            sessionStorage.EMAIL_USUARIO = json.email;
            sessionStorage.NOME_USUARIO = json.nome;
            sessionStorage.ID_USUARIO = json.id;
            sessionStorage.AQUARIOS = JSON.stringify(json.aquarios);

            setTimeout(function () {
              window.location = "./cadastro-destino.html";
            }, 1000);
          });
        } else {
          console.log("Houve um erro ao tentar realizar o login!");

          resposta.text().then((texto) => {
            console.error(texto);
            finalizarAguardar(texto);
          });
        }
      })
      .catch(function (erro) {
        console.log(erro);
      });

    return false;
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>

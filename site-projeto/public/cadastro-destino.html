<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pan-American Highway | Cadastro de Destino</title>

    <script src="./js/sessao.js"></script>
    <script>
      verificarLogin();
    </script>

    <link rel="stylesheet" href="./css/estilo.css" />
    <link rel="icon" href="assets/imgs/logo.png" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
  </head>

  <body onload="validarSessao(); carregarAvaliacoes().then(listarDestinos)">
    <header class="header">
      <div class="container">
        <a href="index.html" class="logo">
          <img src="assets/imgs/logo.png" alt="Pan American Highway">
        </a>

        <nav>
          <ul class="navbar">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="sobre.html">Sobre</a></li>
            <li><a href="timeline.html">Timeline</a></li>
            <li class="agora"><a href="cadastro-destino.html">Destinos</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>

    <main class="destinos">
      <div class="container destinos-container">
        <section class="coluna-form">
          <div class="card">
            <h2>Novo destino</h2>

            <div class="formulario">
              <div class="campo">
                <label for="ipt_pais">🌎</label>
                <input id="ipt_pais" type="text" maxlength="45" placeholder="País" />
                <div id="erroPais" class="msg-erro"></div>
              </div>

              <div class="campo">
                <label for="ipt_cidade">🏙️</label>
                <input id="ipt_cidade" type="text" maxlength="45" placeholder="Cidade" />
                <div id="erroCidade" class="msg-erro"></div>
              </div>

              <div class="campo">
                <label for="ipt_estadia">📅</label>
                <input id="ipt_estadia" type="number" min="1" placeholder="Tempo de estadia (dias)" />
                <div id="erroEstadia" class="msg-erro"></div>
              </div>

              <button class="botao-cadastro" onclick="cadastrarDestino()">Cadastrar destino</button>
            </div>

            <div id="div_aguardar" class="loading-div">
              <img src="./assets/circle-loading.gif" id="loading-gif" />
            </div>

            <div id="div_erros_login"></div>
          </div>
        </section>

        <section class="coluna-lista">
          <div class="lista-topo">
            <div>
              <h2 class="titulo-secao">Destinos cadastrados</h2>
              <div class="linha-titulo"></div>
            </div>
            <span class="contador"><b id="qtd_destinos">0</b> destinos</span>
          </div>

          <ul id="lista_destinos" class="lista-destinos"></ul>
          <div id="estado_lista" class="estado-lista">Carregando destinos...</div>
        </section>
      </div>
    </main>

    <div id="modal_destino" class="modal-fundo" onclick="fecharAoClicarFora(event)">
      <div class="modal-card">

        <div class="modal-topo">
          <div>
            <p id="modal_pais" class="modal-pais"></p>
            <h2 id="modal_cidade" class="modal-cidade"></h2>
            <div class="modal-meta">
              <span id="modal_estadia" class="modal-estadia"></span>
              <span id="modal_media" class="chip-media"></span>
            </div>
          </div>
          <button type="button" class="botao-fechar" onclick="fecharDestino()" title="Fechar">✕</button>
        </div>

        <div class="modal-divisor"></div>

        <div class="modal-secao">
          <h3>Minhas avaliações</h3>
          <p>Avalie cada ponto turístico que você visitou nesta cidade.</p>
        </div>

        <div id="lista_avaliacoes"></div>
      </div>
    </div>
  </body>
</html>

<script>
  var listaDestinos = [];   
  var listaAvaliacoes = []; 
  var destinoAberto = null; 
  var idEditando = null;    
  var notaEscolhida = 0;    

  function carregarAvaliacoes() {
    return fetch(`/avaliacoes/listar/${sessionStorage.ID_USUARIO}`)
      .then(function (resposta) {
        if (resposta.ok) {
          return resposta.json();
        } else {
          throw "status " + resposta.status;
        }
      })
      .then(function (avaliacoes) {
        listaAvaliacoes = avaliacoes;
      })
      .catch(function (erro) {
        console.log(`#ERRO ao carregar avaliações: ${erro}`);
        listaAvaliacoes = [];
      });
  }

  function listarDestinos() {
    fetch(`/destinos/listar/${sessionStorage.ID_USUARIO}`)
      .then(function (resposta) {
        if (resposta.ok) {
          return resposta.json();
        } else {
          throw "status " + resposta.status;
        }
      })
      .then(function (destinos) {
        renderizarDestinos(destinos);
      })
      .catch(function (erro) {
        console.log(`#ERRO: ${erro}`);
        lista_destinos.innerHTML = "";
        estado_lista.style.display = "block";
        estado_lista.innerHTML = "Não foi possível carregar os destinos.";
      });
  }

  function avaliacoesDoDestino(idDestino) {
    var resultado = [];

    for (var i = 0; i < listaAvaliacoes.length; i++) {
      if (listaAvaliacoes[i].fkDestino == idDestino) {
        resultado.push(listaAvaliacoes[i]);
      }
    }

    return resultado;
  }

  function textoResumo(quantidade) {
    if (quantidade == 0) {
      return "Sem avaliações";
    } else if (quantidade == 1) {
      return "1 avaliação";
    } else {
      return quantidade + " avaliações";
    }
  }

  function textoEstadia(destino) {
    if (!destino.tempoEstadia) {
      return "📅 Estadia não informada";
    } else if (destino.tempoEstadia == 1) {
      return "📅 1 dia";
    } else {
      return "📅 " + destino.tempoEstadia + " dias";
    }
  }

  function renderizarDestinos(destinos) {
    listaDestinos = destinos;
    qtd_destinos.innerHTML = destinos.length;

    if (destinos.length == 0) {
      lista_destinos.innerHTML = "";
      estado_lista.style.display = "block";
      estado_lista.innerHTML = "Nenhum destino cadastrado ainda. Que tal adicionar o primeiro?";
      return;
    }

    estado_lista.style.display = "none";

    var html = "";

    for (var i = 0; i < destinos.length; i++) {
      var destino = destinos[i];
      var quantidade = avaliacoesDoDestino(destino.idDestino).length;

      var classeResumo = "resumo-destino";
      if (quantidade == 0) {
        classeResumo = "resumo-destino sem-avaliacao";
      }

      html += `
        <li class="item-destino" onclick="abrirDestino(${i})">
          <p class="pais">${destino.pais}</p>
          <p class="cidade">${destino.cidade}</p>
          <p class="estadia">${textoEstadia(destino)}</p>
          <span class="${classeResumo}">${textoResumo(quantidade)}</span>
        </li>
      `;
    }

    lista_destinos.innerHTML = html;
  }

  function abrirDestino(indice) {
    destinoAberto = listaDestinos[indice];
    idEditando = null;

    modal_pais.innerHTML = destinoAberto.pais;
    modal_cidade.innerHTML = destinoAberto.cidade;
    modal_estadia.innerHTML = textoEstadia(destinoAberto);

    renderizarAvaliacoes();

    modal_destino.classList.add("aberto");
    document.body.style.overflow = "hidden";
  }

  function fecharDestino() {
    destinoAberto = null;
    idEditando = null;
    modal_destino.classList.remove("aberto");
    document.body.style.overflow = "";
  }

  function fecharAoClicarFora(evento) {
    if (evento.target == modal_destino) {
      fecharDestino();
    }
  }

  function renderizarAvaliacoes() {
    var avaliacoes = avaliacoesDoDestino(destinoAberto.idDestino);
    var avaliacaoEditada = null;
    var html = "";

    modal_media.innerHTML = textoResumo(avaliacoes.length);

    for (var i = 0; i < avaliacoes.length; i++) {
      if (avaliacoes[i].idComentario == idEditando) {
        html += htmlFormulario(true);
        avaliacaoEditada = avaliacoes[i];
      } else {
        html += htmlAvaliada(avaliacoes[i]);
      }
    }

    if (idEditando == null) {
      html += htmlFormulario(false);
    }

    lista_avaliacoes.innerHTML = html;

    if (avaliacaoEditada != null) {
      ipt_ponto.value = avaliacaoEditada.pontoTuristico;
      txt_comentario.value = avaliacaoEditada.comentario || "";
      notaEscolhida = Number(avaliacaoEditada.nota);
    } else {
      notaEscolhida = 0;
    }

    pintarEstrelas();
  }

  function htmlEstrelas(nota) {
    var html = "";

    for (var i = 1; i <= 5; i++) {
      if (i <= nota) {
        html += `<span class="estrela-fixa ativa">★</span>`;
      } else {
        html += `<span class="estrela-fixa">★</span>`;
      }
    }

    return html;
  }

  function htmlAvaliada(avaliacao) {
    var nota = Number(avaliacao.nota);
    var comentario = avaliacao.comentario || "Sem comentário.";

    return `
      <div class="linha-avaliacao">
        <div class="col-info">
          <p class="rotulo">Ponto turístico</p>
          <p class="nome-ponto">${avaliacao.pontoTuristico}</p>
          <p class="data-avaliacao">📅 ${avaliacao.data}</p>
        </div>
        <div class="col-avaliacao">
          <div class="linha-nota">
            <span class="rotulo-nota">Nota</span>
            <span class="estrelas-fixas">${htmlEstrelas(nota)}</span>
          </div>
          <p class="comentario-salvo">${comentario}</p>
        </div>
        <div class="col-acoes">
          <button type="button" class="botao-editar" onclick="editarAvaliacao(${avaliacao.idComentario})">✎ Editar</button>
        </div>
      </div>
    `;
  }

  function htmlFormulario(editando) {
    var classe = "linha-avaliacao";
    var rotulo = "Novo ponto turístico";

    if (editando) {
      classe = "linha-avaliacao editando";
      rotulo = "Ponto turístico";
    }

    return `
      <div id="div_formulario" class="${classe}" oninput="ativarFormulario()">
        <div class="col-info">
          <p class="rotulo">${rotulo}</p>
          <input id="ipt_ponto" class="ipt-ponto" type="text" maxlength="80" placeholder="Ex.: Machu Picchu" />
        </div>
        <div class="col-avaliacao">
          <div class="linha-nota">
            <span class="rotulo-nota">Nota</span>
            <span>
              <button type="button" id="estrela_1" class="estrela" onclick="escolherNota(1)">★</button>
              <button type="button" id="estrela_2" class="estrela" onclick="escolherNota(2)">★</button>
              <button type="button" id="estrela_3" class="estrela" onclick="escolherNota(3)">★</button>
              <button type="button" id="estrela_4" class="estrela" onclick="escolherNota(4)">★</button>
              <button type="button" id="estrela_5" class="estrela" onclick="escolherNota(5)">★</button>
            </span>
          </div>
          <textarea id="txt_comentario" class="txt-comentario" maxlength="500"
                    placeholder="Conte como foi sua experiência neste lugar..."></textarea>
        </div>
        <div class="col-acoes">
          <button type="button" class="botao-salvar" onclick="salvarAvaliacao()">✓ Salvar</button>
          <button type="button" class="botao-descartar" onclick="descartarEdicao()">Descartar</button>
        </div>
      </div>
    `;
  }

  function editarAvaliacao(idComentario) {
    idEditando = idComentario;
    renderizarAvaliacoes();
  }

  function descartarEdicao() {
    idEditando = null;
    renderizarAvaliacoes();
  }

  function escolherNota(nota) {
    notaEscolhida = nota;
    ativarFormulario();
    pintarEstrelas();
  }

  function pintarEstrelas() {
    for (var i = 1; i <= 5; i++) {
      var estrela = document.getElementById("estrela_" + i);

      if (i <= notaEscolhida) {
        estrela.classList.add("ativa");
      } else {
        estrela.classList.remove("ativa");
      }
    }
  }

  function ativarFormulario() {
    div_formulario.classList.add("editando");
  }

  function salvarAvaliacao() {
    if (!verificarLogin()) {
      return false;
    }

    var pontoVar = ipt_ponto.value.trim();
    var comentarioVar = txt_comentario.value.trim();
    var idUsuarioVar = sessionStorage.ID_USUARIO;

    if (notaEscolhida < 1) {
      mostrarMensagem("Escolha uma nota de 1 a 5 estrelas.");
      return false;
    }

    if (pontoVar == "") {
      mostrarMensagem("Informe o nome do ponto turístico.");
      return false;
    }

    var url = "/avaliacoes/cadastrar";
    var metodo = "POST";

    if (idEditando != null) {
      url = "/avaliacoes/editar/" + idEditando;
      metodo = "PUT";
    }

    fetch(url, {
      method: metodo,
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        idUsuarioServer: idUsuarioVar,
        idDestinoServer: destinoAberto.idDestino,
        notaServer: notaEscolhida,
        pontoTuristicoServer: pontoVar,
        comentarioServer: comentarioVar,
      }),
    })
      .then(function (resposta) {
        if (resposta.ok) {
          mostrarMensagem("Avaliação de " + pontoVar + " salva!");
          idEditando = null;

          carregarAvaliacoes().then(function () {
            renderizarAvaliacoes();
            listarDestinos();
          });
        } else if (resposta.status == 401) {
          sessionStorage.clear();
          alert("Sua sessão expirou. Faça login novamente.");
          window.location.replace("/login.html");
        } else {
          resposta.text().then(function (texto) {
            mostrarMensagem("Erro ao salvar: " + texto);
          });
        }
      })
      .catch(function (erro) {
        console.log(`#ERRO: ${erro}`);
        mostrarMensagem("Não foi possível conectar ao servidor.");
      });

    return false;
  }


  function cadastrarDestino() {
    if (!verificarLogin()) {
      return false;
    }

    var paisVar = ipt_pais.value.trim();
    var cidadeVar = ipt_cidade.value.trim();
    var estadiaVar = ipt_estadia.value.trim();
    var idUsuarioVar = sessionStorage.ID_USUARIO;
    var flagError = false;

    if (paisVar == "") {
      erroPais.innerHTML = `Informe o país`;
      flagError = true;
    } else {
      erroPais.innerHTML = ``;
    }

    if (cidadeVar == "") {
      erroCidade.innerHTML = `Informe a cidade`;
      flagError = true;
    } else {
      erroCidade.innerHTML = ``;
    }

    if (estadiaVar == "") {
      erroEstadia.innerHTML = `Informe quantos dias ficou`;
      flagError = true;
    } else if (!Number.isInteger(Number(estadiaVar)) || Number(estadiaVar) < 1) {
      erroEstadia.innerHTML = `Use um número inteiro maior que 0`;
      flagError = true;
    } else {
      erroEstadia.innerHTML = ``;
    }

    if (flagError) {
      return false;
    }

    aguardar();

    fetch("/destinos/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        paisServer: paisVar,
        cidadeServer: cidadeVar,
        tempoEstadiaServer: Number(estadiaVar),
        idUsuarioServer: idUsuarioVar,
      }),
    })
      .then(function (resposta) {
        finalizarAguardar();

        if (resposta.ok) {
          mostrarMensagem("Destino cadastrado com sucesso!");
          ipt_pais.value = "";
          ipt_cidade.value = "";
          ipt_estadia.value = "";
          listarDestinos();
        } else if (resposta.status == 401) {
          sessionStorage.clear();
          alert("Sua sessão expirou. Faça login novamente.");
          window.location.replace("/login.html");
        } else {
          resposta.text().then(function (texto) {
            mostrarMensagem("Erro ao cadastrar destino: " + texto);
          });
        }
      })
      .catch(function (erro) {
        console.log(`#ERRO: ${erro}`);
        finalizarAguardar();
        mostrarMensagem("Não foi possível conectar ao servidor.");
      });

    return false;
  }

  function mostrarMensagem(texto) {
    cardErro.style.display = "block";
    mensagem_erro.innerHTML = texto;
    setTimeout(sumirMensagem, 3000);
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>

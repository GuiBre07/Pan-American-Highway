<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pan-American Highway | Cadastro</title>

  <script src="./js/sessao.js"></script>

  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="icon" href="./assets/icon/favicon2.ico" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
</head>

<body >
  <header class="header">
    <div class="container">

      <a href="index.html" class="logo">
        <img src="assets/imgs/logo.png" alt="Pan American Highway">
      </a>

      <nav>
        <ul class="navbar">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="sobre.html">Sobre</a></li>
          <li><a href="timeline.html">Timeline</a></li>
          <li><a href="perfil.html">Perfil</a></li>
        </ul>
      </nav>

    </div>
  </header>

  <div class="login">
      <video class="videoCadastro" src=".\assets\Videos\vancouverCadastro.mp4" autoplay muted loop></video>
    <div class="alerta_erro">
      <div class="card_erro" id="cardErro">
        <span id="mensagem_erro"></span>
      </div>
    </div>
    <div class="container">
      <div class="card card-cadastro">
        <h2>Cadastro</h2>
        <div class="formulario">

          <div class="campo">
            <label for="ipt_nome">👤</label>
            <input id="ipt_nome" type="text" placeholder="Nome"/>
            <div id="erroNome" class="msg-erro"></div>
          </div>

          <div class="campo">
            <label for="ipt_email">✉️</label>
            <input id="ipt_email" type="email" placeholder="Email"/>
            <div id="erroEmail" class="msg-erro"></div>
          </div>

          <div class="campo">
            <label for="ipt_cpf">🪪</label>
            <input id="ipt_cpf" type="text" placeholder="Cpf"/>
            <div id="erroCpf" class="msg-erro"></div>
          </div>

          <div class="campo">
            <label for="ipt_senha">🔒</label>
            <input id="ipt_senha" type="password" placeholder="Senha"/>
            <div id="erroSenha" class="msg-erro"></div>
          </div>

          <div class="campo">
            <label for="ipt_confirmacao_senha">🔒</label>
            <input id="ipt_confirmacao_senha" type="password" placeholder="Confirme a senha"/>
            <div id="erroValSenha" class="msg-erro"></div>
          </div>

          <button class="botao-cadastro" onclick="cadastrar()">Cadastrar</button>
        </div>
        <div id="div_aguardar" class="loading-div">
          <img src="./assets/circle-loading.gif" id="loading-gif" />
        </div>

        <div id="div_erros_login"></div>
      </div>
    </div>
  </div>

</body>

</html>

<script>

  let listaEmpresasCadastradas = [];

  function cadastrar() {

    var nomeVar = ipt_nome.value;
    var emailVar = ipt_email.value;
    var cpfVar = ipt_cpf.value;
    var senhaVar = ipt_senha.value;
    var confirmacaoSenhaVar = ipt_confirmacao_senha.value;
    var flagError = false

    if (nomeVar == '') {
      erroNome.innerHTML = `Informe seu nome`
      flagError = true
    } else {
      erroNome.innerHTML = ``
    }

    if (emailVar == '') {
      erroEmail.innerHTML = `Informe seu email`
      flagError = true
    } else if (emailVar.includes('@') && emailVar.includes('.')) {
      erroEmail = ''
    } else {
      erroEmail.innerHTML = `Email inválido`
      flagError = true
    }

    if (cpfVar == '') {
      erroCpf.innerHTML = `Informe seu cpf`
      flagError = true
    } else if (isNaN(cpfVar)) {
      erroCpf.innerHTML = `Use apenas números`
      flagError = true
    } else if (cpfVar.length != 11) {
      erroCpf.innerHTML = `Deve ter 11 números`
      flagError = true
    } else {
      erroCpf.innerHTML = ``
    }

    var tamanhoSenha = senhaVar.length;
    var temMaiuscula = senhaVar !== senhaVar.toLowerCase();''
    var temMinuscula = senhaVar !== senhaVar.toUpperCase();''

      var contSimbolos = 0;
      var simbolos = '!@#$%&*()_+-=[]{};:,.<>?/|~';

      for (var contador = 0; contador < senhaVar.length; contador++) {
        if (simbolos.includes(senhaVar[contador])) {
          contSimbolos++;
        }
      }

      var errosSenha = '';

    if (tamanhoSenha == 0) {
      errosSenha = 'Informe uma senha';
    } else {
      if (tamanhoSenha < 8) {
        errosSenha += 'Mínimo de 8 caracteres<br>';
      }
      if (!temMaiuscula) {
        errosSenha += 'Use uma letra maiúscula<br>';
      }
      if (!temMinuscula) {
        errosSenha += 'Use uma letra minúscula<br>';
      }
      if (contSimbolos == 0) {
        errosSenha += 'Use um caractere especial<br>';
      }
    }

    if (errosSenha != '') {
      erroSenha.innerHTML = errosSenha;
      flagError = true;
    } else {
      erroSenha.innerHTML = '';
    }

    if (confirmacaoSenhaVar == '') {
      erroValSenha.innerHTML = `Confirme sua senha`;
      flagError = true;
    } else if (senhaVar != confirmacaoSenhaVar) {
      erroValSenha.innerHTML = `As senhas não conferem`;
      flagError = true;
    } else {
      erroValSenha.innerHTML = ``;
    }



      if (flagError) {
        return false;
      }

    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        cpfServer: cpfVar,
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }



  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
